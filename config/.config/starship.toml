# Starship Configuration Template
add_newline = true

[username]
show_always = true
style_user = "bold yellow"
style_root = "bold red"
format = "[$user]($style) "
disabled = false

[hostname]
ssh_only = false
format = "at [$hostname]($style) "
style = "bold green"
disabled = false

[character]
success_symbol = "[➜](bold green)"
error_symbol = "[➜](bold red)"

[directory]
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = " "
style = "bold purple"
